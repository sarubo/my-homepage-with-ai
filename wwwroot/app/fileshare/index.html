<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fileshare</title>
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/fileshare.js" defer></script>
</head>
<body>
  <nav><a href="/">ページ一覧</a><a href="/app/hello_world/">hello_world</a><a href="/app/fileshare/">fileshare</a><a href="/docs/">OpenAPI</a></nav>
  <h1>fileshare</h1>
  <p>ファイルはサーバーのRAMにのみ保存され、サーバーを停止・再起動すると消去されます。</p>
  <form id="upload-form">
    <label>アップロードするファイル <input id="file-input" type="file" multiple required></label>
    <button type="submit">アップロード</button>
  </form>
  <p id="message" role="status"></p>
  <section class="panel">
    <div class="file-actions">
      <button id="delete-selected" type="button">選択したファイルを削除</button>
      <button id="refresh" type="button">一覧を更新</button>
    </div>
    <table class="file-table">
      <thead><tr><th><input id="select-all" type="checkbox" aria-label="全選択"></th><th>名前</th><th>サイズ</th><th>登録時刻 (UTC)</th><th>操作</th></tr></thead>
      <tbody id="file-list"></tbody>
    </table>
  </section>
</body>
</html>
